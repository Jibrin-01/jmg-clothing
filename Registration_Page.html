<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JMG Clothing | Create Account</title>

    <style>

    /* ==============================
       1. GENERAL PAGE STYLING
       ============================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
        padding: 30px 15px;
    }


    /* ==============================
       2. REGISTRATION CONTAINER
       ============================== */

    .registration-container {
        width: 100%;
        max-width: 450px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        text-align: center;
    }


    /* ==============================
       3. JMG LOGO
       ============================== */

    .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 15px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #111111;
        color: #d4af37;

        border-radius: 50%;

        font-size: 22px;
        font-weight: bold;
        letter-spacing: 2px;
    }


    /* ==============================
       4. COMPANY NAME
       ============================== */

    h1 {
        font-size: 27px;
        color: #222222;
        margin-bottom: 10px;
    }


    /* ==============================
       5. DESCRIPTION
       ============================== */

    .description {
        color: #666666;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 25px;
    }


    /* ==============================
       6. FORM
       ============================== */

    #registrationForm {
        text-align: left;
    }


    /* ==============================
       7. LABELS
       ============================== */

    #registrationForm label {
        display: block;
        margin-bottom: 7px;

        color: #333333;
        font-size: 14px;
        font-weight: bold;
    }


    /* ==============================
       8. INPUT FIELDS
       ============================== */

    #registrationForm input[type="text"],
    #registrationForm input[type="email"],
    #registrationForm input[type="tel"],
    #registrationForm input[type="password"] {

        width: 100%;
        padding: 13px 14px;

        margin-bottom: 18px;

        border: 1px solid #cccccc;
        border-radius: 8px;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
    }


    /* ==============================
       9. INPUT FOCUS EFFECT
       ============================== */

    #registrationForm input:focus {
        border-color: #d4af37;

        box-shadow:
            0 0 0 3px rgba(212, 175, 55, 0.12);
    }


    /* ==============================
       PASSWORD ERROR MESSAGE
       ============================== */

    .error-message {
        display: none;
        margin: -8px 0 16px;

        color: #b00020;
        font-size: 13px;
        font-weight: bold;
    }


    /* ==============================
       10. TERMS CHECKBOX
       ============================== */

    #registrationForm label:has(input[type="checkbox"]) {
        display: flex;
        align-items: center;

        gap: 8px;

        margin-bottom: 20px;

        font-size: 13px;
        font-weight: normal;
        color: #555555;
    }

    #registrationForm input[type="checkbox"] {
        width: 16px;
        height: 16px;

        accent-color: #111111;
    }


    /* ==============================
       11. REGISTER BUTTON
       ============================== */

    button {
        width: 100%;

        padding: 13px;

        background: #111111;
        color: white;

        border: none;
        border-radius: 8px;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }


    /* ==============================
       12. BUTTON HOVER EFFECT
       ============================== */

    button:hover {
        background: #d4af37;
        color: #111111;
    }


    /* ==============================
       13. LOGIN LINK
       ============================== */

    .registration-container > p:last-child {
        margin-top: 20px;

        color: #666666;
        font-size: 14px;
    }

    .registration-container a {
        color: #b28b00;

        font-weight: bold;

        text-decoration: none;
    }

    .registration-container a:hover {
        text-decoration: underline;
    }


    /* ==============================
       14. MOBILE RESPONSIVENESS
       ============================== */

    @media (max-width: 480px) {

        .registration-container {
            padding: 25px 20px;
        }

        h1 {
            font-size: 24px;
        }

    }

</style>
</head>

<body>

    <div class="registration-container">

        <div class="logo">
            JMG
        </div>

        <h1>JMG Clothing</h1>

        <p class="description">
            Welcome to JMG Clothing: Home of quality Fabrics.
            Create an account to get started.
        </p>

        <form id="registrationForm">

            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >


            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >


            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
            >


            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <p
                class="error-message"
                id="passwordError"
                aria-live="polite"
            ></p>


            <label>
                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                I agree to the Terms and Conditions
            </label>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

<script>

    const registrationForm = document.getElementById("registrationForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const passwordError = document.getElementById("passwordError");

    registrationForm.addEventListener("submit", function(event) {

        if (password.value !== confirmPassword.value) {

            event.preventDefault();

            passwordError.textContent = "Passwords do not match. Please try again.";
            passwordError.style.display = "block";

            confirmPassword.focus();

        } else {

            passwordError.textContent = "";
            passwordError.style.display = "none";
        }

    });

</script>

</body>

</html>
